name: sdp-dev
services:
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM mariadb:10.11
        COPY --chmod=644 config/mariadb.cnf /etc/mysql/conf.d/sdp.cnf
    environment:
      MARIADB_DATABASE: sdp_development
      MARIADB_USER: sdp_dev
      MARIADB_PASSWORD: ${SDP_DB_PASSWORD:?Run scripts/setup.sh}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
  wordpress:
    build:
      context: .
      args:
        PHP_OS_IMAGE: ${SDP_PHP_OS_IMAGE:-ubuntu:24.04}
        PHP_VERSION: ${SDP_PHP_VERSION:-8.3}
        WORDPRESS_VERSION: ${SDP_WORDPRESS_VERSION:-6.9}
        WORDPRESS_SHA256: ${SDP_WORDPRESS_SHA256:-5b36390233e32fef68cb5f66435bb32bdd50e0b3dfa5750aceb2de3c5993d720}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SDP_BIND_ADDRESS:-127.0.0.1}:${SDP_HTTP_PORT:-3000}:80"
    environment:
      SDP_DB_PASSWORD: ${SDP_DB_PASSWORD:?Run scripts/setup.sh}
      SDP_WP_SECRET: ${SDP_WP_SECRET:?Run scripts/setup.sh}
    volumes:
      - uploads:/var/www/html/wp-content/uploads
volumes:
  database:
  uploads:
