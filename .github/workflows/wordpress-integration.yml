name: WordPress Integration and Preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: sdp_test
          MARIADB_USER: sdp_test
          MARIADB_PASSWORD: disposable-ci-only
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SDP_DB_PASSWORD: disposable-ci-only
      SDP_LOGIN_PROBE: '1'
      SDP_PREVIEW_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, curl, mbstring, xml, zip, gd, intl
          coverage: none
      - name: Initialize disposable paths
        env:
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          {
            echo "SDP_DB_PORT=$DB_PORT"
            echo "SDP_WP_ROOT=$RUNNER_TEMP/sdp-wordpress"
            echo "SDP_WP_CLI=$RUNNER_TEMP/wp-cli.phar"
            echo "SDP_PREVIEW_MANIFEST=$RUNNER_TEMP/sdp-preview.json"
            echo "SDP_PREVIEW_AUTH=$RUNNER_TEMP/sdp-preview-auth.json"
          } >> "$GITHUB_ENV"
      - name: Validate preview configuration
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          php -l scripts/seed-preview.php
          php -l scripts/codespace-https.php
          python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
          python3 -m py_compile tests/browser/test_preview.py
      - name: Install WP-CLI
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$SDP_WP_CLI"
      - name: Actual WordPress and MariaDB smoke test
        run: |
          mkdir -p artifacts
          bash scripts/setup-preview.sh 2>&1 | tee artifacts/integration.log
      - name: Install Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/sdp-venv"
          "$RUNNER_TEMP/sdp-venv/bin/pip" install playwright==1.51.0
          "$RUNNER_TEMP/sdp-venv/bin/playwright" install --with-deps chromium
      - name: Actual browser preview
        run: |
          bash scripts/start-preview.sh > artifacts/preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS "$SDP_PREVIEW_URL/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$SDP_PREVIEW_URL/" >/dev/null
          "$RUNNER_TEMP/sdp-venv/bin/python" tests/browser/test_preview.py 2>&1 | tee artifacts/browser.log
      - name: Actual CSV and XLSX integration
        run: bash scripts/test-import-integration.sh 2>&1 | tee artifacts/import-integration.log
      - name: Opt-in summary cache and cross-process invalidation
        run: bash scripts/test-summary-cache-small.sh 2>&1 | tee artifacts/summary-cache-small.log
      - name: Bounded scale benchmark (100, 1000 and 10000 fictional schools)
        id: scale
        if: matrix.php == '8.3'
        run: python3 scripts/test-benchmark-integration.py 2>&1 | tee artifacts/benchmark.log
      - name: Bounded HTTP benchmark
        if: matrix.php == '8.3' && steps.scale.outcome == 'success'
        run: python3 scripts/test-http-integration.py 2>&1 | tee artifacts/http-benchmark.log
      - name: Experimental single-slot summary cache
        if: ${{ !cancelled() && matrix.php == '8.3' && steps.scale.outcome == 'success' }}
        run: php -d memory_limit=128M "$SDP_WP_CLI" --path="$SDP_WP_ROOT" --allow-root --user=sdp_preview_admin eval-file tests/integration/test-summary-cache.php 2>&1 | tee artifacts/summary-cache.log
      - name: Real HTTP summary cache off/on comparison
        if: ${{ !cancelled() && matrix.php == '8.3' && steps.scale.outcome == 'success' }}
        run: python3 -u scripts/test-summary-http.py 2>&1 | tee artifacts/summary-http.log
      - name: Read-only SQL query-shape experiments
        if: ${{ !cancelled() && matrix.php == '8.3' && steps.scale.outcome == 'success' }}
        run: python3 scripts/test-query-shapes.py 2>&1 | tee artifacts/query-shapes.log
      - name: SQL query plans and optional index comparison
        if: ${{ !cancelled() && matrix.php == '8.3' && steps.scale.outcome == 'success' }}
        run: python3 scripts/test-index-comparison.py 2>&1 | tee artifacts/index-comparison.log
      - name: Remove temporary browser credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sdp-preview-auth.json"
      - name: Save screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-preview-php-${{ matrix.php }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  candidate-packages:
    name: Build verified development candidate ZIPs
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build exact tested checkout twice
        run: |
          sha="$(git rev-parse HEAD)"
          python3 tools/build_candidate.py --repo . --commit "$sha" --output "$RUNNER_TEMP/candidate"
          python3 tools/build_candidate.py --repo . --commit "$sha" --output "$RUNNER_TEMP/candidate-repeat"
          diff -r "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/candidate-repeat"
      - name: Verify SHA256 and archive structure independently
        run: |
          python3 - "$RUNNER_TEMP/candidate" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          root=Path(sys.argv[1])
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["status"]=="development_candidate_not_release"
          assert len(manifest["packages"])==2
          for p in manifest["packages"]:
              f=root/p["file"]
              assert hashlib.sha256(f.read_bytes()).hexdigest()==p["sha256"]
              with zipfile.ZipFile(f) as z:
                  assert z.testzip() is None and len(z.namelist())==p["files"]
              print("PASS:",f.name,p["sha256"])
          PY
      - name: Upload candidate ZIPs, not a public release
        uses: actions/upload-artifact@v4
        with:
          name: sekolah-directory-development-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7

  candidate-installation:
    name: Verify candidate ZIP installation
    needs: candidate-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: sdp_test
          MARIADB_USER: sdp_test
          MARIADB_PASSWORD: disposable-ci-only
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SDP_DB_PASSWORD: disposable-ci-only
      SDP_PREVIEW_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sekolah-directory-development-candidate
          path: ${{ runner.temp }}/candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, curl, mbstring, xml, zip, gd, intl
          coverage: none
      - name: Initialize disposable paths
        env:
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          {
            echo "SDP_DB_PORT=$DB_PORT"
            echo "SDP_WP_ROOT=$RUNNER_TEMP/sdp-wordpress"
            echo "SDP_WP_CLI=$RUNNER_TEMP/wp-cli.phar"
            echo "SDP_PREVIEW_MANIFEST=$RUNNER_TEMP/sdp-preview.json"
          } >> "$GITHUB_ENV"
          mkdir -p artifacts
      - name: Install WP-CLI
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$SDP_WP_CLI"
      - name: Actual archive install or replacement
        run: bash scripts/test-candidate-install.sh "${{ matrix.mode }}" 2>&1 | tee artifacts/package-install.log
      - name: Save package installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-install-${{ matrix.mode }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
