# TEMPLATE: ganti domain, root, socket PHP dan sertifikat sebelum nginx -t.
server {
    listen 80;
    server_name example.invalid;
    return 301 https://example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/sekolah/public;
    index index.php;
    client_max_body_size 8m;
    server_tokens off;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    # Tidak pernah simpan file backup atau rahasia di webroot.
    location ~ /\. { deny all; }
    location ~* ^/(?:wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt)(?:/|$) { deny all; }
    location ~* \.(?:sql|bak|old|orig|log|ini|env|swp)(?:/|$) { deny all; }
    # Cegah eksekusi PHP langsung dari uploads, tema dan plugin.
    location ~* ^/(?:wp-content|wp-includes)/.*\.(?:php[0-9]*|phtml|phar)(?:/|$) { deny all; }
    location / { try_files $uri $uri/ /index.php?$args; }
    # Static cache browser 7 hari. Jangan gunakan untuk media privat.
    location ~* ^/(?:wp-content|wp-includes)/.*\.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm-sdp.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
        fastcgi_cache off;
        # Opsional: GANTI baris fastcgi_cache off dengan isi sdp-cache-optional.conf.
    }
    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) { deny all; }
}
