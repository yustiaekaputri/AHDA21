# SNIPPET, bukan conf.d terpisah. Masukkan hanya ke location PHP.
# Setelah uji staging dan persetujuan cache halaman publik yang dipilih.
fastcgi_cache sdp_public;
fastcgi_cache_key "$scheme|$host|$request_uri";
fastcgi_cache_bypass $sdp_skip_cache;
fastcgi_no_cache $sdp_skip_cache;
fastcgi_cache_valid 200 60s;
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 3s;
fastcgi_cache_use_stale off;
# Jangan fastcgi_ignore_headers: hormati Set-Cookie, Cache-Control, Vary, Expires.
# Jangan cache halaman operator, profil, akun, admin, REST, hasil pencarian.
add_header X-SDP-Cache $upstream_cache_status always;
add_header X-Content-Type-Options nosniff always;
