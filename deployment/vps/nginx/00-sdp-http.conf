# Include dalam http {}, bukan server {}. Opsional cache HTML tetap off.
fastcgi_cache_path /var/cache/nginx/sdp levels=1:2 keys_zone=sdp_public:4m max_size=64m inactive=10m use_temp_path=off;
# Hanya URI tepat ini yang dapat dipertimbangkan. Jangan tambah profil/operator/REST.
map $request_uri $sdp_path_ok { default 0; ~^/tentang-kami/$ 1; }
map $request_method $sdp_method_ok { default 0; GET 1; HEAD 1; }
# Semua cookie, query string, Authorization dan Range: bypass.
map "$sdp_path_ok:$sdp_method_ok:$http_cookie:$http_authorization:$args:$http_range" $sdp_skip_cache {
    default 1;
    "1:1::::" 0;
}
